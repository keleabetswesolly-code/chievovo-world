name: Build Android App

on:
  push:
    branches:
      - main 

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'

      # Look inside the android folder to make gradlew executable
      - name: Make gradlew executable
        working-directory: android
        run: chmod +x ./gradlew

      # Look inside the android folder to build the app
      - name: Build with Gradle
        working-directory: android
        run: ./gradlew bundleRelease -PversionCode=3 -PversionName="3.130297.3"
