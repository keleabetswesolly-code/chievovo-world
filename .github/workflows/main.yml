name: Build Android App

on:
  push:
    branches:
      - main 

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # 1. Get the code from your repository (Updated to v5)
      - name: Checkout code
        uses: actions/checkout@v5

      # 2. Set up Java (Updated to v5 to fix the deprecation warning)
      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'

      # 3. Make the Gradle wrapper executable
      - name: Make gradlew executable
        run: chmod +x ./gradlew

      # 4. Your specific build command with the overridden version numbers
      - name: Build with Gradle
        run: ./gradlew bundleRelease -PversionCode=3 -PversionName="3.130297.3"
