name: Build Android App

# This tells GitHub to run the build whenever you push to the main branch
on:
  push:
    branches:
      - main 

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # 1. Get the code from your repository
      - name: Checkout code
        uses: actions/checkout@v4

      # 2. Set up Java (required to build Android apps)
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      # 3. Make the Gradle wrapper executable (prevents permission errors)
      - name: Make gradlew executable
        run: chmod +x ./gradlew

      # 4. Your specific build command with the overridden version numbers
      - name: Build with Gradle
        run: ./gradlew bundleRelease -PversionCode=3 -PversionName="3.130297.3"
